services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bonusapp}
      POSTGRES_USER: ${POSTGRES_USER:-bonusapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bonusapp_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bonusapp} -d ${POSTGRES_DB:-bonusapp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bonusapp}:${POSTGRES_PASSWORD:-bonusapp_secret}@postgres:5432/${POSTGRES_DB:-bonusapp}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-min-32-chars!!}
      JWT_ALGORITHM: HS256
      JWT_TTL_HOURS: 8
      HMAC_SECRET: ${HMAC_SECRET:-change-hmac-secret-in-production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
