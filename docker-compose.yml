services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bonusapp}
      POSTGRES_USER: ${POSTGRES_USER:-bonusapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bonusapp_secret}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-dev-db.sql:/docker-entrypoint-initdb.d/init-dev-db.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bonusapp} -d ${POSTGRES_DB:-bonusapp}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bonusapp}:${POSTGRES_PASSWORD:-bonusapp_secret}@postgres:5432/${POSTGRES_DB:-bonusapp}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-min-32-chars!!}
      JWT_ALGORITHM: HS256
      JWT_TTL_HOURS: 8
      HMAC_SECRET: ${HMAC_SECRET:-change-hmac-secret-in-production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      POS_API_KEYS: ${POS_API_KEYS:-pos-key-terminal-001,pos-key-terminal-002}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
